name: Desktop

# Builds the desktop installers (Windows, macOS, Linux). A tag like v0.2.0 also
# publishes them as a GitHub release with that version (v0.2.0-beta: a pre-release),
# its notes from docs/release-notes.md; "Run workflow" on the Actions
# page builds them without releasing (download them from the run's artifacts).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # The web app is the same on every system: build it once.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist

  package:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Package
        working-directory: desktop
        # Not code-signed: Windows SmartScreen and macOS Gatekeeper warn on first start.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: files
          merge-multiple: true
      # Notes from docs/release-notes.md; a tag with a suffix (v0.1.0-beta) is a
      # pre-release.
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          body_path: docs/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
