name: Bug report
description: Something doesn't work, sounds wrong, or crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Browser (bangermix.horly.dev)
        - Desktop app, Windows
        - Desktop app, macOS
        - Desktop app, Linux
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Browser and system
      placeholder: Chrome 140 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Errors, if any
      description: In Chrome, press F12 (in the desktop app, Ctrl+Shift+I) and copy anything red from the Console tab.
      render: text
