[package]
name = "rekordcrate"
version = "0.3.0"
authors = ["Jan Holthuis <jan.holthuis@ruhr-uni-bochum.de>"]
description = "Library for parsing Pioneer Rekordbox device exports (vendored into bangermix, see PATCHES.md)"
repository = "https://github.com/Holzhaus/rekordcrate"
license = "MPL-2.0"
edition = "2021"
publish = false

[lib]
# Its own tests need the upstream test data, which is not vendored.
test = false
doctest = false

[dependencies]
binrw = "0.15"
modular-bitfield = "0.13"
crc16 = "0.4"
parse-display = "0.11"
thiserror = "2.0"
fallible-iterator = "0.3.0"
quick-xml = { version = "0.42", features = ["serialize", "serde-types"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
serde_repr = { version = "0.1.19", optional = true }
faster-hex = { version = "2.0", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
rgb = { version = "0.8", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"], optional = true }

[features]
default = []
xml = ["dep:serde", "dep:serde_repr", "dep:quick-xml", "dep:chrono", "dep:rgb"]
json = ["dep:serde", "dep:serde_json", "dep:faster-hex"]
artwork = ["dep:image"]
